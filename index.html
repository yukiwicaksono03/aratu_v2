<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19191b">
  <meta name="description" content="Studio foto pribadi Anda. Edit, retouch, filter, dan buat kolase langsung di browser, bahkan saat offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./public/icon.svg">
  <link rel="apple-touch-icon" href="./public/icon-192.png">
  <link rel="stylesheet" href="./src/styles.css">
  <title>Aratu Studio — Make it yours.</title>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
  <input id="collage-upload" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple hidden>
  <noscript>Aktifkan JavaScript untuk menggunakan Aratu Studio. Foto diproses di perangkat Anda.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
